<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Размеры фото</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font: 12px/1.35 "Segoe UI", Tahoma, Arial, sans-serif;
    padding: 10px;
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    background-color: #323232;
    color: #d4d4d4;
  }
  body.light { color: #262626; }
  input, select { -webkit-user-select: text; user-select: text; }

  .count-box {
    text-align: center;
    padding: 8px 6px 10px;
    margin-bottom: 10px;
    border: 1px solid #4a4a4a;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.18);
  }
  body.light .count-box { border-color: #b9b9b9; background: rgba(0, 0, 0, 0.05); }
  .count-label { font-size: 11px; opacity: 0.75; }
  .count-num { font-size: 34px; font-weight: 600; line-height: 1.15; }
  .count-sizes { font-size: 11px; opacity: 0.9; margin-top: 2px; word-wrap: break-word; }

  .btn {
    display: block;
    width: 100%;
    margin: 0 0 6px;
    padding: 7px 8px;
    font: inherit;
    border-radius: 4px;
    border: 1px solid #5a5a5a;
    background: #484848;
    color: #e6e6e6;
    cursor: pointer;
    box-sizing: border-box;
  }
  .btn:hover { background: #565656; }
  body.light .btn { background: #e4e4e4; color: #222; border-color: #aaa; }
  body.light .btn:hover { background: #d6d6d6; }
  .btn.primary { background: #2d8ceb; border-color: #2d8ceb; color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #1473d6; }
  .btn.small { padding: 4px 8px; margin-top: 8px; }
  .btn[disabled] { opacity: 0.5; cursor: default; }

  details { margin-top: 10px; }
  summary { cursor: pointer; padding: 2px 0; outline: none; }
  .field { display: block; margin: 7px 0 0; }
  .field span { display: block; margin-bottom: 2px; opacity: 0.85; }
  .field input, .field select {
    width: 100%;
    box-sizing: border-box;
    padding: 4px 6px;
    font: inherit;
    border-radius: 3px;
    border: 1px solid #5a5a5a;
    background: #262626;
    color: #e6e6e6;
  }
  body.light .field input, body.light .field select { background: #fff; color: #222; border-color: #aaa; }

  .status { margin-top: 8px; min-height: 16px; font-size: 11px; word-wrap: break-word; }
  .status.ok { color: #4caf50; }
  .status.warn { color: #e0a030; }
  .status.err { color: #e5534b; }

  .support { margin-top: 14px; text-align: center; }
  .link {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 11px;
    color: #7fb2ea;
    text-decoration: underline;
    cursor: pointer;
  }
  body.light .link { color: #1473d6; }
  .support-box {
    display: none;
    margin-top: 8px;
    padding: 8px;
    text-align: left;
    border: 1px solid #4a4a4a;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.18);
  }
  body.light .support-box { border-color: #b9b9b9; background: rgba(0, 0, 0, 0.05); }
  .mail {
    width: 100%;
    box-sizing: border-box;
    margin: 4px 0 2px;
    padding: 4px 6px;
    font: inherit;
    border-radius: 3px;
    border: 1px solid #5a5a5a;
    background: #262626;
    color: #e6e6e6;
  }
  body.light .mail { background: #fff; color: #222; border-color: #aaa; }
  .row { overflow: hidden; }
  .row .btn { float: left; width: calc(50% - 3px); margin: 6px 0 0; }
  .row .btn + .btn { margin-left: 6px; }
</style>
</head>
<body class="dark">
  <div class="count-box">
    <div class="count-label">Найдено фото</div>
    <div id="count" class="count-num">—</div>
    <div id="sizes" class="count-sizes">Нажмите «Уточнить»</div>
  </div>

  <button id="btnRefresh" class="btn" title="Пересчитать фото на листе">Уточнить</button>
  <button id="btnRun" class="btn primary" title="Нарисовать размеры рядом с каждым фото">Добавить подписи</button>
  <button id="btnRemove" class="btn" title="Удалить группу «Размеры»">Убрать подписи</button>

  <details id="settings">
    <summary>Настройки</summary>
    <label class="field"><span>Высота цифр, мм</span><input id="optText" type="text" value="1,5"></label>
    <label class="field"><span>Расстояние до фото, мм</span><input id="optOffset" type="text" value="1,3"></label>
    <label class="field"><span>Толщина линий, мм</span><input id="optLine" type="text" value="0,15"></label>
    <label class="field"><span>Подпись высоты</span>
      <select id="optSide"><option value="right">справа от фото</option><option value="left">слева от фото</option></select>
    </label>
    <label class="field"><span>Подпись ширины</span>
      <select id="optWidth"><option value="all">у каждого фото</option><option value="bottom">только у нижнего в колонке</option></select>
    </label>
    <button id="btnReset" class="btn small">Сбросить настройки</button>
  </details>

  <div id="status" class="status"></div>

  <div class="support">
    <button id="btnSupport" class="link" type="button">Поддержка</button>
    <div id="supportBox" class="support-box">
      <div>По любым вопросам пишите:</div>
      <input id="mail" class="mail" type="text" readonly value="tidesluck@icloud.com">
      <div class="row">
        <button id="btnMail" class="btn small" type="button">Написать</button>
        <button id="btnCopy" class="btn small" type="button">Копировать</button>
      </div>
    </div>
  </div>

  <script src="js/main.js" charset="UTF-8"></script>
</body>
</html>
